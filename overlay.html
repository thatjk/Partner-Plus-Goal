te-space:nowrap;font-size:30px;font-weight:850;line-height:1.1;text-shadow:0 0 22px var(--glow)}.wrap[data-style="compact"]{max-width:400px}.compact{padding:20px 22px;width:100%}.heading{display:flex;align-items:center;justify-content:space-between}.heading h2{margin:0;font-size:19px}.compactnums{display:flex;justify-content:flex-end;align-items:baseline;gap:7px;margin:10px 0 12px;font-weight:800}.compactnums strong{font-size:32px}.compactnums span{color:#aeb2c2}.subline{display:flex;justify-content:space-between;color:#b9bdcc;font-size:13px;margin-top:9px}.wrap[data-style="full"]{max-width:640px}.full{padding:26px 30px}.fulltop{display:flex;justify-content:space-between;align-items:center}.fulltop h2{font-size:22px;margin:0}.fullbar{height:26px;margin:22px 0 12px;position:relative}.fullbar .fill{max-width:100%}.barlabel{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;text-shadow:0 1px 4px #000}.month{color:#aeb2c2;font-size:14px}.fullfoot{display:flex;justify-content:space-between;color:#c7cad4;font-size:14px}.wrap[data-style="ticker"]{max-width:900px;text-align:center}.ticker{font-size:29px;font-weight:900;letter-spacing:.025em;white-space:nowrap;text-shadow:0 3px 10px #000,0 0 20px var(--glow)}.ticker em{font-style:normal;color:var(--a)}.wrap[data-style="hero"]{max-width:640px;text-align:center}.hero{padding:26px 20px}.herolabel{font-size:14px;font-weight:850;letter-spacing:.14em;color:#bdc0cc}.heronum{font-size:76px;font-weight:900;line-height:1.05;margin:10px 0 4px}.heronum small{font-size:27px;color:#aeb2c2;font-weight:700}.herosub{font-size:15px;color:#c2c5d0}.wrap[data-style="ring"]{max-width:640px;text-align:center}.ringcard{padding:18px}.ringlabel{font-size:14px;font-weight:850;letter-spacing:.12em;color:#c7cad4;margin-bottom:9px}.ringbox{width:140px;height:140px;margin:0 auto;position:relative;filter:drop-shadow(0 0 10px var(--glow))}.ringbox svg{width:140px;height:140px;transform:rotate(-90deg)}.ringtrack,.ringvalue{fill:none;stroke-width:9}.ringtrack{stroke:rgba(255,255,255,.12)}.ringvalue{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .4s}.ringpercent{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:850}.ringnums{font-size:20px;font-weight:800;margin-top:8px}.ringnums span{color:#aeb2c2}.wrap[data-style="banner"]{max-width:800px}.banner{padding:16px 20px 13px;border-radius:16px}.bannerrow{height:44px;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:10px}.bannerleft{display:flex;gap:8px;align-items:center}.bannerleft .month{font-size:13px}.bannertitle{text-align:center;font-size:19px;font-weight:850}.bannernums{text-align:right;font-size:21px;font-weight:850;white-space:nowrap}.bannernums span{color:#aeb2c2;font-size:16px}.bannerbar{height:8px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden}.wrap[data-style="pill"]{max-width:900px;text-align:center}.badge{display:inline-block;background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:14px 24px;font-weight:900;font-size:24px;box-shadow:0 0 30px var(--glow);white-space:nowrap}.badge em{font-style:normal;color:var(--a)}
body[data-style="full"],body[data-style="banner"]{padding-left:0;padding-right:0}.wrap[data-style="full"],.wrap[data-style="banner"]{width:100%}.full{width:100%;padding:30px 36px 26px;min-height:220px}.fulltop h2{font-size:26px}.fullnums{display:flex;align-items:baseline;gap:10px;margin:16px 0 0;font-weight:900;line-height:1}.fullnums strong{font-size:38px;background:linear-gradient(100deg,var(--a),var(--b));color:transparent;background-clip:text}.fullnums span:first-of-type{font-size:20px;color:#aeb2c2}.fullnums span:last-child{font-size:22px;color:#d9dbe5}.fullbar{height:26px;margin:18px 0 18px}.barlabel{font-size:14px}.fullfoot{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;color:#c7cad4;font-size:14px}.fullfoot>span{min-width:0;white-space:normal}.fullfoot>span:first-child{text-align:left}.fullfoot>span:nth-child(2){text-align:center}.fullfoot>span:last-child{text-align:right}.fullfoot b{font-variant-numeric:tabular-nums}.banner{width:100%;padding:18px 24px 16px;border-radius:16px}.bannerrow{height:54px;grid-template-columns:minmax(164px,1fr) auto minmax(140px,1fr);align-items:center;gap:16px}.bannerleft{gap:10px;min-width:0;white-space:nowrap}.bannerleft .month{font-size:13px;white-space:nowrap}.bannertitle{font-size:22px;white-space:nowrap}.bannernums{font-size:25px;font-variant-numeric:tabular-nums}.bannerbar{height:8px;margin-top:7px}.fill{min-width:0}@media(max-width:620px){.full{padding:22px 20px;min-height:0}.fulltop h2{font-size:21px}.fullnums{margin-top:12px}.fullnums strong{font-size:32px}.fullfoot{grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12px}.fullfoot>span:nth-child(2){text-align:right}.fullfoot>span:last-child{grid-column:1/-1;text-align:left}.banner{padding:14px 12px 12px}.bannerrow{height:auto;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.bannertitle{grid-column:1/-1;grid-row:1;text-align:left;font-size:18px}.bannerleft{grid-column:1;grid-row:2;gap:7px}.bannerleft .month{font-size:11px}.bannernums{grid-column:2;grid-row:2;font-size:19px}.bannernums span{font-size:14px}}@media(max-height:210px){body{padding:8px 14px}.full{min-height:0;padding:8px 14px}.fulltop h2{font-size:16px}.fullnums{margin-top:4px;gap:7px}.fullnums strong{font-size:22px}.fullnums span:first-of-type,.fullnums span:last-child{font-size:15px}.fullbar{height:14px;margin:8px 0}.fullfoot{gap:8px;font-size:10px}.fullfoot>span:nth-child(2){font-size:10px}.banner{padding:10px 16px 8px}.bannerrow{height:36px}.bannerbar{height:6px;margin-top:5px}}</style>
</head>
<body data-style="text" data-theme="mono">
<main id="overlay" class="wrap" data-style="text" aria-live="polite">
<div class="view" data-view="text"><div class="textpanel"><div class="textline gradient" id="textline">Plus Goal: — / —</div></div></div>
<div class="view" data-view="compact"><section class="panel compact"><div class="heading"><h2>Plus Goal</h2><span class="pill" data-level>LEVEL 1</span></div><div class="compactnums"><strong data-current>—</strong><span>/</span><span data-target>—</span></div><div class="bar"><div class="fill" data-fill></div></div><div class="subline"><span data-percent>—%</span><span data-remaining>— remaining</span></div></section></div>
<div class="view" data-view="full"><section class="panel full"><div class="fulltop"><h2>Plus Goal</h2><span class="pill" data-level>LEVEL 1</span></div><div class="fullnums"><strong data-current>—</strong><span>/</span><span data-target>—</span></div><div class="fullbar bar"><div class="fill" data-fill></div><div class="barlabel" data-bar-label>—%</div></div><div class="fullfoot"><span class="month" data-month>Month</span><span><b data-remaining>—</b> points remaining</span><span>@<b data-user>channel</b></span></div></section></div>
<div class="view" data-view="ticker"><div class="ticker">PLUS <em data-level-short>LV 1</em>, <span data-current>—</span> / <span data-target>—</span>, <span data-percent>—%</span></div></div>
<div class="view" data-view="hero"><section class="panel hero"><div class="herolabel">PLUS GOAL, LEVEL <span data-level-number>1</span>, <span data-month-upper>MONTH</span></div><div class="heronum gradient"><span data-current>—</span> <small>/ <span data-target>—</span></small></div><div class="herosub"><b data-percent>—%</b> complete <span aria-hidden="true">|</span> <span data-remaining>—</span> points remaining</div></section></div>
<div class="view" data-view="ring"><section class="panel ringcard"><div class="ringlabel">PLUS GOAL, LEVEL <span data-level-number>1</span></div><div class="ringbox"><svg viewBox="0 0 140 140" aria-hidden="true"><defs><linearGradient id="ringGrad"><stop offset="0%" stop-color="var(--a)"/><stop offset="100%" stop-color="var(--b)"/></linearGradient></defs><circle class="ringtrack" cx="70" cy="70" r="59"/><circle class="ringvalue" cx="70" cy="70" r="59" stroke-dasharray="370.7" stroke-dashoffset="370.7" data-ring/></svg><div class="ringpercent" data-percent>—%</div></div><div class="ringnums"><span data-current>—</span> / <span data-target>—</span></div><div class="month" data-month>Month</div></section></div>
<div class="view" data-view="banner"><section class="panel banner"><div class="bannerrow"><div class="bannerleft"><span class="pill" data-level>LEVEL 1</span><span class="month" data-month>Month</span></div><div class="bannertitle">Plus Goal</div><div class="bannernums"><b data-current>—</b> <span>/</span> <span data-target>—</span></div></div><div class="bannerbar"><div class="fill" data-fill></div></div></section></div>
<div class="view" data-view="pill"><div class="badge"> <em data-level-short>LV 1</em>, <span data-current>—</span> / <span data-target>—</span>, <span data-percent>—%</span></div></div>
<div id="error" class="error" hidden>No Plus Goal data</div>
</main>
<script>
(()=>{const params=new URLSearchParams(location.search);const allowedStyles=['text','compact','full','ticker','hero','ring','banner','pill'];const allowedThemes=['mono','grape','mint','gold','ocean','sunset','rose','emerald'];const pathMatch=location.pathname.match(/^\/overlay=([A-Za-z0-9_]{3,25})$/i);const rawChannel=window.__PLUS_CHANNEL|| (pathMatch&&pathMatch[1]) || params.get('channel') || params.get('c') || 'powergpu';const channel=String(rawChannel).toLowerCase();const valid=/^[a-z0-9_]{3,25}$/.test(channel);const requestedStyle=params.get('style')||'text';const style=allowedStyles.includes(requestedStyle)?requestedStyle:'text';const requestedTheme=params.get('theme')||'mono';const theme=allowedThemes.includes(requestedTheme)?requestedTheme:'mono';const refresh=Math.min(300,Math.max(10,Number(params.get('refresh'))||10))*1000;const widthParam=params.get('w');const width=widthParam===null?0:Math.min(900,Math.max(220,Number(widthParam)||220));const hide=params.get('hide')==='1';const defaultServer=location.protocol==='file:'?'http://localhost:8413':location.origin;const server=(params.get('server')||defaultServer).replace(/\/$/,'');const root=document.getElementById('overlay');const error=document.getElementById('error');document.body.dataset.style=style;document.body.dataset.theme=theme;if(params.get('stage')==='1')document.body.classList.add('stage');root.dataset.style=style;root.style.maxWidth=width?`${width}px`:'';document.querySelectorAll('.view').forEach(el=>el.hidden=el.dataset.view!==style);if(!valid){setUnavailable();return}function setUnavailable(){if(hide){root.style.display='none';return}root.style.display='block';document.querySelectorAll('.view').forEach(el=>el.hidden=true);error.hidden=false;error.textContent=`No Plus Goal data for @${channel}`}function putAll(selector,value){document.querySelectorAll(selector).forEach(el=>el.textContent=value)}function render(data){if(!data||data.current===null||data.current===undefined){setUnavailable();return}error.hidden=true;root.style.display='block';document.querySelectorAll('.view').forEach(el=>el.hidden=el.dataset.view!==style);const level=Number(data.goal_level)||1;const current=Number(data.current);const target=Number(data.target);const percent=Number(data.percent);const remaining=Number(data.remaining);const fill=`${Math.min(100,Math.max(0,percent))}%`;putAll('[data-current]',String(current));putAll('[data-target]',String(target));putAll('[data-percent]',`${percent}%`);putAll('[data-remaining]',String(remaining));putAll('[data-level]',`LEVEL ${level}`);putAll('[data-level-number]',String(level));putAll('[data-level-short]',`LV ${level}`);putAll('[data-user]',channel);putAll('[data-month]',`${data.month_label} ${String(data.month).slice(0,4)}`);putAll('[data-month-upper]',String(data.month_label).toUpperCase());document.getElementById('textline').textContent=`Plus Goal: ${current} / ${target} (${percent}%)`;putAll('[data-bar-label]',`${percent}%`);document.querySelectorAll('[data-fill]').forEach(el=>el.style.width=fill);const ring=document.querySelector('[data-ring]');if(ring)ring.style.strokeDashoffset=String(370.7-(370.7*Math.min(100,Math.max(0,percent))/100))}async function update(){try{const response=await fetch(`${server}/plusgoal=${encodeURIComponent(channel)}`,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw new Error('unavailable');const data=await response.json();render(data)}catch{setUnavailable()}}update();setInterval(update,refresh)})();
</script>
